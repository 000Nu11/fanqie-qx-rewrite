# ============================================
# 番茄小说去广告 · Quantumult X 重写规则
# 效果：去开屏广告 / 信息流广告 / 阅读器内广告 / 底部 banner
# 原则：评论区接口一个都不碰，保证评论正常看
# 更新 2026-10-15：*.ecombdapi.com 拦截保留（字节电商 API），但 10-15 07:17 实测 banner 可在 ecombdapi 被拦死(0B)时照常弹出——它不是 banner 配置通道
# 更新 2026-10-15：开屏广告走 *.tanx.com（阿里妈妈 Tanx），加拦截
# 更新 2026-10-15：Stream 抓包发现冷启动单次请求 praisewindow-sinfonlinea.ugsdk.cn（用户增长 SDK 弹窗服务，SSL pinning 包体不可见）；加拦截做可逆实验验证是否为 banner 配置通道
# 更新 2026-10-20：开屏复现。冷启动日志中 tanx/ecombdapi/pangolin 均未出现，gecko.zijieapi.com 有 23KB 下发；拦截后冷启动实测开屏消失，坐实为新开屏通道（包体 SSL pinning 不可见，域名级定位）
# 更新 2026-10-24：补丁（外部表交叉印证）：穿山甲编号变体 2-5、pglstatp、oceanengine、ad.zijieapi.com、ads3/ads5-normal 全套变体、ad-sign.byteimg.com；刻意未收 fqnovelpic.com、*.snssdk.com 整站、ip-asn 138699、dig.bdurl.net、umeng、frontier100-toutiao-lq（原因见规则内注释）
# 更新 2026-10-25：测试补丁（可莉 Loon 清单对照）：+32 条 reject-200（abtest3-misc、gecko3/5、snssdk 单 host、fqnovel 埋点/监控等）；ads3/ads5-normal 已有正则覆盖不重复
# 更新 2026-10-26：小七 sgmodule 对照 +15 个 host（ads4 全套 4 个合成 1 条正则、abtest3-misc-hl/lf、gecko5-hj/lq、p3/p6-ad-sign、i-lq、pangolin.snssdk.com 全套 4 个）；reject-200 55→67 条
# ============================================

[rewrite_local]

# ---------- 1. 广告 SDK 域名直接拒绝 ----------
# 穿山甲(Pangle) 广告 SDK 专用域名：只负责下发广告，
# 不承载正文、章节、评论，拦掉不影响阅读和评论
^https?:\/\/[a-z0-9.-]*\.pangolin-sdk-toutiao\.com\/.* url reject-200
^https?:\/\/[a-z0-9.-]*\.pangolin-sdk-toutiao1\.com\/.* url reject-200
^https?:\/\/[a-z0-9.-]*\.pangolin-sdk-toutiao-b\.com\/.* url reject-200
^https?:\/\/[a-z0-9.-]*\.pangle\.io\/.* url reject-200
# 字节电商广告 API（保留拦截；10-15 实证：不是底部 banner 的配置通道）
^https?:\/\/[a-z0-9.-]*\.ecombdapi\.com\/.* url reject-200
# 阿里妈妈 Tanx 广告交易平台：开屏广告物料下发（10-15 实测：df.tanx.com/ef-dongfeng.tanx.com 拉开屏）
^https?:\/\/[a-z0-9.-]*\.tanx\.com\/.* url reject-200
# 用户增长 SDK 弹窗服务：10-15 Stream 抓包，冷启动时单次请求，名称+时序指向运营弹窗/banner 配置下发
# （SSL pinning，包体不可见，无法直接证实；可逆实验：拦截后冷启动验证 banner 是否消失）
^https?:\/\/[a-z0-9.-]*\.praisewindow-sinfonlinea\.ugsdk\.cn\/.* url reject-200
# Gecko 资源下发通道（2026-10-20 定位并实测坐实）：新开屏通道，冷启动时下发开屏配置/物料；
# 拦截后冷启动开屏消失。后续若开屏再现，先查本域名是否改名/换子域
^https?:\/\/([a-z0-9-]+\.)?gecko\.zijieapi\.com\/.* url reject-200

# ----- 2026-10-24 新增：外部去广告表交叉印证条目 -----
# 来源：afdriu ban.list、yfamilys AntiAD.list（202610）、Gemini 版配置中经核实的部分
# 只收已交叉印证的广告域名；以下各项刻意未收：
#  fqnovelpic.com（番茄图片 CDN，拦了会断全部图片）、*.snssdk.com 整站（SDK 基础服务）、
#  ip-asn 138699（字节自有 ASN，全断）、dig.bdurl.net（百度系，与字节 App 无关）、
#  umeng 系（含推送/APM）、frontier100-toutiao-lq（AntiAD 仅有 lf 版，lq 版未实锤）
# 穿山甲编号变体：AntiAD 收录 api-access.pangolin-sdk-toutiao2/3/4/5.com，同族 SDK 域名一并覆盖
^https?:\/\/[a-z0-9.-]*\.pangolin-sdk-toutiao2\.com\/.* url reject-200
^https?:\/\/[a-z0-9.-]*\.pangolin-sdk-toutiao3\.com\/.* url reject-200
^https?:\/\/[a-z0-9.-]*\.pangolin-sdk-toutiao4\.com\/.* url reject-200
^https?:\/\/[a-z0-9.-]*\.pangolin-sdk-toutiao5\.com\/.* url reject-200
# 穿山甲统计域名（ban.list + Gemini 版均有）
^https?:\/\/[a-z0-9.-]*\.pglstatp-toutiao\.com\/.* url reject-200
# 巨量引擎 / 穿山甲备用域（ban.list）
^https?:\/\/[a-z0-9.-]*\.oceanengine\.com\/.* url reject-200
# zijieapi 广告域名：ad.zijieapi.com（AntiAD + Gemini 版均有）
^https?:\/\/([a-z0-9-]+\.)?ad\.zijieapi\.com\/.* url reject-200
# zijieapi ads3/ads5-normal 全套变体（AntiAD 收录 ads3/ads5-normal 及 -hl/-lf/-lq 变体；
# 10-24 实测 ads5-normal-lq.zijieapi.com 为明牌广告接口）
^https?:\/\/[a-z0-9.-]*ads[35]-normal[a-z0-9.-]*\.zijieapi\.com\/.* url reject-200
# 字节图片广告签名域名（ban.list + Gemini 版均有；注意：只拦 ad-sign 这一个 host，
# 不碰 byteimg.com 图片 CDN 本身）
^https?:\/\/([a-z0-9-]+\.)?ad-sign\.byteimg\.com\/.* url reject-200

