# ============================================
# 番茄小说去广告 · Quantumult X 重写规则
# 效果：去开屏广告 / 信息流广告 / 阅读器内广告 / 底部 banner
# 原则：评论区接口一个都不碰，保证评论正常看
# 更新 2026-10-15：底部 banner 已定位到 *.ecombdapi.com（字节电商广告 API），拦截后不再出现
# 更新 2026-10-15：开屏广告走 *.tanx.com（阿里妈妈 Tanx），加拦截
# ============================================

[rewrite_local]

# ---------- 1. 广告 SDK 域名直接拒绝 ----------
# 穿山甲(Pangle) 广告 SDK 专用域名：只负责下发广告，
# 不承载正文、章节、评论，拦掉不影响阅读和评论
^https?:\/\/[a-z0-9.-]*\.pangolin-sdk-toutiao\.com\/.* url reject-200
^https?:\/\/[a-z0-9.-]*\.pangolin-sdk-toutiao1\.com\/.* url reject-200
^https?:\/\/[a-z0-9.-]*\.pangolin-sdk-toutiao-b\.com\/.* url reject-200
^https?:\/\/[a-z0-9.-]*\.pangle\.io\/.* url reject-200
# 字节电商广告 API：底部 banner 配置下发通道
# 10-14 实测：banner 弹出同秒出现该域名 5KB 级 JSON 请求；加拦截后 banner 不再出现，阅读/评论正常
^https?:\/\/[a-z0-9.-]*\.ecombdapi\.com\/.* url reject-200
# 阿里妈妈 Tanx 广告交易平台：开屏广告物料下发（10-15 实测：df.tanx.com/ef-dongfeng.tanx.com 拉开屏）
^https?:\/\/[a-z0-9.-]*\.tanx\.com\/.* url reject-200

# ---------- 2. 通用 JSON 去广告（自动跳过评论接口） ----------
# fanqie_ads.js 里遇到评论 URL 会直接放行；
# 只删除带明确广告标记的数据，不确定的不动。
^https?:\/\/[a-z0-9.-]*\.fanqienovel\.com\/.* url script-response-body https://raw.githubusercontent.com/000Nu11/fanqie-qx-rewrite/main/fanqie_ads.js

[mitm]
hostname = %APPEND% *.pangolin-sdk-toutiao.com, *.pangolin-sdk-toutiao1.com, *.pangolin-sdk-toutiao-b.com, *.pangle.io, *.ecombdapi.com, *.tanx.com, *.fanqienovel.com

# ============ 使用说明 ============
# 1. QX 开启 MitM，并安装证书且在「设置-通用-关于本机-证书信任设置」里信任它
#    （不做这步，https 重写都不生效）
# 2. 把本文件以「引用」方式加入 QX：重写 -> 右上角引用 -> 粘贴本文件直链；
#    或直接把 [rewrite_local] 段粘贴进你的配置
# 3. 验证：打开一本书，进章节评论区，能正常加载即成功
#
# 还剩广告怎么办：
# 用 Stream（App Store 免费）抓包，找到广告请求的域名和路径发给我，
# 我帮你把规则加固。评论区如果异常，先把第 2 段规则注释掉再试。
