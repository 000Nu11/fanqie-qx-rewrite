# ============ 使用说明 ============
# 1. QX 开启 MitM，并安装证书且在「设置-通用-关于本机-证书信任设置」里信任它
#    （不做这步，https 重写都不生效）
# 2. 把本文件以「引用」方式加入 QX：重写 -> 右上角引用 -> 粘贴本文件直链；
#    或直接把 [rewrite_local] 段粘贴进你的配置
# 3. 验证：打开一本书，进章节评论区，能正常加载即成功
#
# 还剩广告怎么办：
# 用 Stream（App Store 免费）抓包，找到广告请求的域名和路径发给我，
# 我帮你把规则加固。评论区如果异常，先把第 2 段规则注释掉再试。
