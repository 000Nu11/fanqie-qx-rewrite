# [DEBUG] banner 抓包临时版：script 均指向 fanqie_banner_debug.js
# （去广告逻辑不变，仅多记 banner 日志；抓到接口后换回正式版）
# ============================================
# 番茄小说去广告 · Quantumult X 重写规则
# 效果：去开屏广告 / 信息流广告 / 阅读器内广告
# 原则：评论区接口一个都不碰，保证评论正常看
# ============================================

[rewrite_local]

# ---------- 1. 广告 SDK 域名直接拒绝 ----------
# 穿山甲(Pangle) 广告 SDK 专用域名：只负责下发广告，
# 不承载正文、章节、评论，拦掉不影响阅读和评论
^https?:\/\/[a-z0-9.-]*\.pangolin-sdk-toutiao\.com\/.* url reject-200
^https?:\/\/[a-z0-9.-]*\.pangolin-sdk-toutiao1\.com\/.* url reject-200
^https?:\/\/[a-z0-9.-]*\.pangolin-sdk-toutiao-b\.com\/.* url reject-200
^https?:\/\/[a-z0-9.-]*\.pangle\.io\/.* url reject-200

# ---------- 2. 通用 JSON 去广告（自动跳过评论接口） ----------
# fanqie_ads.js 里遇到评论 URL 会直接放行；
# 只删除带明确广告标记的数据，不确定的不动。
# 使用前先把 https://raw.githubusercontent.com/000Nu11/fanqie-qx-rewrite/main/fanqie_ads.js 换成 fanqie_ads.js 的 https 直链
# （比如传到 GitHub Gist 后取 raw 链接）
^https?:\/\/[a-z0-9.-]*\.fanqienovel\.com\/.* url script-response-body https://raw.githubusercontent.com/000Nu11/fanqie-qx-rewrite/main/fanqie_banner_debug.js

# ---------- 3. 可选：覆盖 App 自己的 API 域名 ----------
# 如果发现 App 内广告走的是它自己的 API 域名：
# 用抓包工具（见下方说明）找到真实域名后，
# 把下面这行取消注释，并把 __APP_API_HOST__ 换成真实域名，
# 同时把该域名追加到 [mitm] 的 hostname 里。
# [DEBUG] banner 抓包临时规则，抓到后删除
# [DEBUG] 临时注释：fqnovel.com 脚本导致评论区网络错误，先禁用脚本、仅保留 MITM 观察
# ^https?:\/\/[a-z0-9.-]*\.fqnovel\.com\/.* url script-response-body https://raw.githubusercontent.com/000Nu11/fanqie-qx-rewrite/main/fanqie_banner_debug.js

[mitm]
hostname = %APPEND% *.pangolin-sdk-toutiao.com, *.pangolin-sdk-toutiao1.com, *.pangolin-sdk-toutiao-b.com, *.pangle.io, *.fanqienovel.com, *.fqnovel.com

# ============ 使用说明 ============
# 1. QX 开启 MitM，并安装证书且在「设置-通用-关于本机-证书信任设置」里信任它
#    （不做这步，https 重写都不生效）
# 2. 把本文件以「引用」方式加入 QX：重写 -> 右上角引用 -> 粘贴本文件直链；
#    或直接把 [rewrite_local] 段粘贴进你的配置
# 3. 把 fanqie_ads.js 传到可直链访问的地方，替换上面的 https://raw.githubusercontent.com/000Nu11/fanqie-qx-rewrite/main/fanqie_ads.js
# 4. 验证：打开一本书，进章节评论区，能正常加载即成功
#
# 还剩广告怎么办：
# 用 Stream（App Store 免费）抓包，找到广告请求的域名和路径发给我，
# 我帮你把规则加固。评论区如果异常，先把第 2 段规则注释掉再试。
